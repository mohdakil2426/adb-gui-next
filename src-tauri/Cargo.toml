[package]
name = "adb-gui-next"
version = "0.2.5"
description = "ADB GUI Next for Android device workflows"
authors = ["Astrixforge (mohdakil2426)"]
edition = "2024"
license = "MIT"
repository = "https://github.com/mohdakil2426/adb-gui-next"
readme = "../README.md"
keywords = ["adb", "android", "tauri", "fastboot"]
categories = ["development-tools"]

[lib]
name = "adb_gui_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.104"
apk-info-axml = "1.0.12"
base64 = "0.23.1"
bzip2 = "0.6.1"
hex = "0.4.3"
log = "0.4.33"
libc = "0.2.189"
memmap2 = "0.9.11"
prost = "0.14.4"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "fs", "io-util", "macros"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2.5.4"
tempfile = "3.27.0"
url = "2.5.8"
which = "8.0.5"
# liblzma is the maintained fork of xz2 (API-compatible XzDecoder path).
# Do not also depend on xz2 — dual native lzma links break the link step.
liblzma = "0.4.8"
zstd = "0.13.3"
zip = "8.6.0"
tar = "0.4.46"
# HTTP range bodies / zero-copy reclaim into Vec when refcount == 1.
bytes = "1.12.1"
tauri-plugin-clipboard-manager = "2.3.2"
urlencoding = "2.1.3"
dunce = "1.0.5"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }

# OPS/OFP firmware format support
aes = "0.9.2"
cfb-mode = "0.9.1"
md-5 = "0.11.0"
quick-xml = "0.41.0"
brotli = { version = "8.0.4", optional = true }

# HTTP client for marketplace + payload
reqwest = { version = "0.13.4", features = ["rustls", "stream", "http2", "blocking", "json"] }

futures-util = "0.3.34"
keyring = "3.6"
rand = "0.8"
open = "5.3"
# zlib-rs: pure-Rust zlib backend (~1.5–2× inflate vs miniz_oxide on factory/ZIP deflate).
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
byteorder = "1.5.0"
lz4_flex = "0.14.0"
scraper = "0.27.0"
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
] }
[dev-dependencies]
proptest = { version = "1.11.0", features = ["attr-macro"] }
criterion = "0.8.2"

[[bench]]
name = "copy_benchmark"
harness = false

[features]
default = ["local_zip", "remote_zip", "brotli"]
local_zip = []
remote_zip = []
brotli = ["dep:brotli"]

# Maximum (non-extreme) quality bar — Cargo + Clippy official groups.
# CI: `cargo clippy --all-targets -- -D warnings` (package.json lint:rust).
# Pedantic: cherry-picked only (Clippy docs: do not enable whole group as deny).
# Restriction: unwrap/expect only; never whole restriction group.
# See: https://doc.rust-lang.org/clippy/lints.html
# See: https://doc.rust-lang.org/cargo/reference/lints.html
# Editor "anyOf" warnings on this table are a Cargo JSON-schema bug, not invalid TOML
# (taplo.toml disables schema validation for Cargo.toml).
[lints.rust]
# Surface unsafe; modules that need memmap2/FFI use local #![allow(unsafe_code)].
unsafe_code = "warn"

[lints.clippy]
# Cargo.toml hygiene (Clippy cargo group)
cargo = "warn"
# Restriction cherry-picks — tests exempt via clippy.toml
unwrap_used = "warn"
expect_used = "warn"
# Pedantic cherry-picks (high signal; avoided bulk style noise like uninlined_format_args)
manual_let_else = "warn"
manual_ok_or = "warn"
manual_map = "warn"
map_unwrap_or = "warn"
needless_continue = "warn"
single_match_else = "warn"
semicolon_if_nothing_returned = "warn"
manual_string_new = "warn"
# Intentionally NOT enabled: full pedantic/restriction/nursery; uninlined_format_args (noise)

[profile.dev]
incremental = true

# The workload is CPU-bound (sha2, inflate/zstd/lzma, large memcpy) so release is
# speed-optimized. `opt-level = "s"` was previously set here, which disables loop
# vectorization and most unrolling — exactly what the extract path needs — and every
# shipped artifact was built with it.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
