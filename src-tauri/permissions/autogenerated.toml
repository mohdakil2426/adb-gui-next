# Split ACL: keep allow-all for main desktop window (single trusted UI).
# Read-only queries vs device-mutating commands are listed for documentation / future windows.
[[permission]]
identifier = "allow-device-read"
description = "Device and marketplace query commands (no flash/debloat/install mutations)."
commands.allow = [
  "get_bootloader_variables",
  "get_device_info",
  "get_device_mode",
  "get_device_telemetry",
  "get_devices",
  "get_fastboot_devices",
  "get_installed_packages",
  "get_avd_restore_plan",
  "list_avds",
  "list_files",
  "host_path_kinds",
  "reveal_device_path_in_explorer",
  "list_payload_partitions",
  "list_payload_partitions_with_details",
  "list_remote_payload_partitions",
  "get_remote_payload_metadata",
  "check_remote_payload",
  "diagnose_payload",
  "marketplace_search",
  "marketplace_get_app_detail",
  "marketplace_list_versions",
  "get_device_sdk",
  "load_debloat_lists",
  "get_debloat_packages",
  "get_debloat_data",
  "list_debloat_backups",
  "get_debloat_device_settings",
  "get_ops_metadata",
  "scan_avd_root_readiness",
  "verify_avd_root",
  "verify_file_root_access",
  "fetch_magisk_stable_release",
  "scrcpy_status",
  "scrcpy_check_update",
  "scrcpy_active_sessions",
  "scrcpy_presets",
  "scrcpy_get_toolbar_state",
  "get_app_icons",
  "get_logcat_snapshot",
  "get_host_tool_versions",
  "host_setup_status",
  "get_package_details",
  "get_all_devices",
  "get_app_overview_telemetry",
  "get_flasher_vitals",
  "inspect_partition_image",
  "scrcpy_preview_command",
  "scrcpy_profiles",
  "scrcpy_calculate_bandwidth_metrics",
  "emulator_get_avd_specs",
  "emulator_get_disk_breakdown",
  "system_host_resources",
  "marketplace_check_updates",
  "marketplace_get_overview_stats",
  "marketplace_get_curated_tools",
  "compute_partition_file_sha256",
  "get_extraction_presets"
]

