name: Publish Release

# Official: tauri-apps/tauri-action (build + draft release assets).
# Custom: scripts/make-windows-portable.ps1 only for Windows portable zip.
# macOS optional if Apple secrets exist; product policy still treats macOS as paused.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.2.5 (must match package.json)'
        required: true
        default: '0.2.5'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      macos_enabled: ${{ steps.macos.outputs.macos_enabled }}
    steps:
      - name: Require main branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Manual releases must run from main. Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # Official: https://v2.tauri.app/distribute/pipelines/github/
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: publish-preflight
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun ci

      - name: Sync check package.json ↔ Cargo.toml ↔ dispatch input
        run: |
          PKG=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          CARGO=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          echo "input=${{ inputs.version }} package.json=$PKG Cargo.toml=$CARGO"
          test "$PKG" = "${{ inputs.version }}"
          test "$PKG" = "$CARGO"

      - name: Reject existing GitHub release for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ inputs.version }} already exists. Bump version or delete draft/tag first."
            exit 1
          fi

      - name: Detect macOS signing secrets
        id: macos
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$KEYCHAIN_PASSWORD" ]; then
            echo "macos_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "macos_enabled=false" >> $GITHUB_OUTPUT
            echo "macOS build skipped (secrets incomplete; product builds remain paused by policy)"
          fi

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Run frontend tests
        run: bun run test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: TypeScript + Vite build
        run: bun run build

      - name: Require release notes file
        run: test -f ".github/release-notes/v${{ inputs.version }}.md"

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # cpu = user-facing download label (64bit|32bit|arm); arch = Rust triple prefix
          - name: linux-64bit
            platform: ubuntu-22.04
            artifact-platform: linux
            arch: x86_64
            cpu: 64bit
            rust-target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage
            chmod-tools: true
          - name: linux-arm
            platform: ubuntu-22.04-arm
            artifact-platform: linux
            arch: aarch64
            cpu: arm
            rust-target: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu --bundles deb,rpm,appimage --config src-tauri/tauri.linux-arm64.bundle.json
            chmod-tools: false
          - name: windows-64bit
            platform: windows-latest
            artifact-platform: windows
            arch: x86_64
            cpu: 64bit
            rust-target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
            chmod-tools: false
          - name: windows-32bit
            platform: windows-latest
            artifact-platform: windows
            arch: i686
            cpu: 32bit
            rust-target: i686-pc-windows-msvc
            args: --target i686-pc-windows-msvc --bundles nsis,msi
            chmod-tools: false
          - name: windows-arm
            platform: windows-latest
            artifact-platform: windows
            arch: aarch64
            cpu: arm
            rust-target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
            chmod-tools: false

    steps:
      # Platform-tools are Git LFS. Official: https://github.com/actions/checkout (lfs default false)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
          lfs: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Official: https://v2.tauri.app/distribute/pipelines/github/
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Setup Bundled Permissions
        if: matrix.chmod-tools
        run: |
          chmod +x src-tauri/resources/linux/adb
          chmod +x src-tauri/resources/linux/fastboot
          chmod +x src-tauri/resources/linux/etc1tool
          chmod +x src-tauri/resources/linux/hprof-conv
          chmod +x src-tauri/resources/linux/make_f2fs
          chmod +x src-tauri/resources/linux/make_f2fs_casefold
          chmod +x src-tauri/resources/linux/mke2fs
          chmod +x src-tauri/resources/linux/sqlite3

      - name: Install frontend dependencies
        run: bun ci

      - name: Verify dispatch version matches package.json
        run: |
          PKG=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          test "$PKG" = "${{ inputs.version }}"

      - name: Build and upload with tauri-action
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: ADB GUI Next v__VERSION__
          releaseBody: |
            Draft release for ADB GUI Next. Builds are unsigned. Full notes and SHA256SUMS are applied by the finalize job.
          releaseDraft: true
          prerelease: false
          releaseCommitish: main
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          # User-facing: 64bit|32bit|arm (matrix.cpu). [setup]=-setup for NSIS.
          releaseAssetNamePattern: ADB-GUI-Next-v[version]-${{ matrix.artifact-platform }}-${{ matrix.cpu }}[setup][ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ADB-GUI-Next-v[version]-${{ matrix.artifact-platform }}-${{ matrix.cpu }}[setup][ext]

      - name: Make and upload Windows portable zip
        if: matrix.artifact-platform == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ inputs.version }}'
          $zipName = "ADB-GUI-Next-v${version}-windows-${{ matrix.cpu }}-portable.zip"
          $zipPath = Join-Path $PWD $zipName
          ./scripts/make-windows-portable.ps1 `
            -Version $version `
            -Arch '${{ matrix.arch }}' `
            -TargetTriple '${{ matrix.rust-target }}' `
            -OutputZip $zipPath
          gh release upload "v${version}" $zipPath --clobber
          "PORTABLE_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload portable as workflow artifact
        if: matrix.artifact-platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ADB-GUI-Next-v${{ env.VERSION }}-windows-${{ matrix.cpu }}-portable.zip
          path: ${{ env.PORTABLE_ZIP }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  build-macos:
    name: Build macos-universal
    needs: preflight
    if: needs.preflight.outputs.macos_enabled == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Apple Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep -E "Developer ID Application|Apple Distribution|Apple Development" | head -n 1)
          if [ -z "$CERT_INFO" ]; then
            echo "::error::No Apple code signing identity found"
            exit 1
          fi
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> $GITHUB_ENV

      - name: Rust cache
        uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Setup Bundled Permissions
        run: |
          chmod +x src-tauri/resources/darwin/adb || true
          chmod +x src-tauri/resources/darwin/fastboot || true
          chmod +x src-tauri/resources/darwin/etc1tool || true
          chmod +x src-tauri/resources/darwin/hprof-conv || true
          chmod +x src-tauri/resources/darwin/make_f2fs || true
          chmod +x src-tauri/resources/darwin/make_f2fs_casefold || true
          chmod +x src-tauri/resources/darwin/mke2fs || true
          chmod +x src-tauri/resources/darwin/sqlite3 || true

      - name: Install frontend dependencies
        run: bun ci

      - name: Verify dispatch version matches package.json
        run: |
          PKG=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          test "$PKG" = "${{ inputs.version }}"

      - name: Build and upload macOS DMG with tauri-action
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          projectPath: .
          tauriScript: bun run tauri
          args: --target universal-apple-darwin --bundles dmg
          tagName: v__VERSION__
          releaseName: ADB GUI Next v__VERSION__
          releaseDraft: true
          prerelease: false
          releaseCommitish: main
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          releaseAssetNamePattern: ADB-GUI-Next-v[version]-macos-universal[ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: release-file-ADB-GUI-Next-v[version]-macos-universal[ext]

  finalize:
    name: Checksums on draft release
    needs: [build, build-macos]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Notes, checksums, draft polish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE=".github/release-notes/v${{ inputs.version }}.md"
          test -f "$NOTES_FILE"
          gh release edit "v${{ inputs.version }}" \
            --draft \
            --title "ADB GUI Next v${{ inputs.version }}" \
            --notes-file "$NOTES_FILE"

          mkdir -p release-assets
          gh release download "v${{ inputs.version }}" --dir release-assets --pattern 'ADB-GUI-Next-v${{ inputs.version }}-*'
          (
            cd release-assets
            find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum | sed 's#^\./##'
          ) > release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt
          ls -la release-assets
          gh release upload "v${{ inputs.version }}" release-assets/SHA256SUMS.txt --clobber
